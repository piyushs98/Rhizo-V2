# Render paid (starter) blueprint — preferred for anything beyond demos.
#
# ONE service running the supervisor, which spawns the engine and the
# dashboard as separate child processes sharing a WAL-mode SQLite file on a
# mounted disk. That gives process isolation without paying for two services.
#
# The disk is not optional at this tier of seriousness. Render's filesystem
# is ephemeral: without it, every deploy wipes your position history and
# open book.

services:
  - type: web
    name: janus-desk
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /healthz
    disk:
      name: janus-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DB_PATH
        value: /var/data/janus.db
      - key: LOG_DIR
        value: /var/data/logs
      - key: ENV
        value: production
      - key: LOG_JSON
        value: "true"
      - key: STARTING_CAPITAL
        value: "10000"
      - key: CRYPTO_MAX_EXPOSURE
        value: "1000"
      - key: EQUITY_INSTRUMENT
        value: "options"
      - key: MAX_SINGLE_TRADE_PCT
        value: "0.25"
      - key: EXECUTE_THRESHOLD
        value: "75"
      - key: EXECUTE_THRESHOLD_CRYPTO
        value: "70"
      - key: RISK_PCT_PER_TRADE
        value: "0.08"
      - key: TARGET_MONEYNESS
        value: "0.0"
      - key: MARKET_REGIME_FILTER
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK
        sync: false
      - key: DISCORD_CRITICAL_WEBHOOK
        sync: false
