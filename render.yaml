# Render free-tier blueprint.
#
# Free instances have no persistent disk. Without EPHEMERAL_STORAGE_ACK the
# process refuses to boot rather than silently wipe the position book on
# every restart. For a real book, use render.paid.yaml (starter + 1 GB disk).
#
# Keep-alive: free tier spins down on idle. Point cron-job.org at
# https://YOUR-SERVICE.onrender.com/healthz every 5 minutes, or set
# KEEPALIVE_ENABLED=true (outbound self-ping from the engine; binds no port).
# See DEPLOY.md.

services:
  - type: web
    name: janus-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DB_PATH
        value: ./data/janus.db
      - key: LOG_DIR
        value: ./logs
      - key: ENV
        value: production
      - key: LOG_JSON
        value: "true"
      - key: STARTING_CAPITAL
        value: "10000"
      - key: CRYPTO_MAX_EXPOSURE
        value: "1000"
      - key: EQUITY_INSTRUMENT
        value: "options"
      - key: MAX_SINGLE_TRADE_PCT
        value: "0.25"
      - key: EXECUTE_THRESHOLD
        value: "75"
      - key: EXECUTE_THRESHOLD_CRYPTO
        value: "70"
      - key: RISK_PCT_PER_TRADE
        value: "0.08"
      - key: TARGET_MONEYNESS
        value: "0.0"
      - key: MARKET_REGIME_FILTER
        value: "false"
      # Required on free tier. Acknowledge that restarts wipe the book.
      - key: EPHEMERAL_STORAGE_ACK
        value: "true"
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK
        sync: false
      - key: DISCORD_CRITICAL_WEBHOOK
        sync: false
